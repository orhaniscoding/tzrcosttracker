name: linux
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: 1
      DO_NOT_TRACK: 1
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.16.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm -r rebuild
      - run: pnpm exec turbo run test build --force
      - run: node --test scripts/run-docker.node.mjs scripts/run-local.node.mjs
      - name: Build and start the documented Docker distribution
        env:
          COSTCORE_COMPOSE_PROJECT: costcore-ci
        run: |
          set -eu
          trap 'if test -f .cache/costcore-docker/local.env; then docker compose -p costcore-ci --env-file .cache/costcore-docker/local.env down -v; fi' EXIT
          node scripts/run-docker.mjs up --wait
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 2 http://127.0.0.1:18080/health
          curl --fail --silent --show-error -D headers.txt -o /dev/null http://127.0.0.1:18080/
          grep -qi '^content-security-policy:' headers.txt
          grep -qi '^x-content-type-options: nosniff' headers.txt
          grep -qi '^x-frame-options: DENY' headers.txt
  build-test-windows:
    runs-on: windows-latest
    env:
      TURBO_TELEMETRY_DISABLED: 1
      DO_NOT_TRACK: 1
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.16.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r rebuild
      - run: pnpm exec turbo run test build --force
      - run: node --test scripts/run-docker.node.mjs scripts/run-local.node.mjs
